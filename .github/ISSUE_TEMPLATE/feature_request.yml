name: Feature request
description: An idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should SignTurk do instead?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
