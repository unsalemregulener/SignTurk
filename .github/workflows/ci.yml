name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests, grammar eval and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        # Ruff at the version in requirements-dev.txt, so its updates reach this job
        run: pip install "numpy<2.0" "$(grep -E '^ruff==' requirements-dev.txt | cut -d' ' -f1)"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q backend.py database.py models.py live226.py landmark_smoother.py rate_limit.py signturk_runtime text_processing tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Sentence engine evaluation
        run: python -m text_processing.eval --check --min-exact 0.98
      - name: Model weights are reachable
        run: python tools/download_models.py --check

  interface:
    name: Interface scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Babel
        # The version the page loads, so the check compiles what browsers compile
        run: npm install --no-save --no-package-lock "@babel/standalone@$(grep -oE '@babel/standalone@[0-9.]+' frontend/app/index.html | cut -d@ -f3)"
      - name: Compile the JSX
        run: node tools/check_jsx.mjs

  backend:
    name: Backend with the real model
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Restore model weights
        uses: actions/cache@v6
        with:
          path: |
            research/model_226/models
          key: models-${{ hashFiles('model-assets.json') }}
      - name: Download model weights
        run: python tools/download_models.py
      - name: End-to-end check with the real model
        run: python tests/backend_smoke.py
