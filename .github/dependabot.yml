version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # The model files and their preprocessing depend on these; move them on
    # purpose, with the end-to-end check, rather than through monthly PRs.
    ignore:
      - dependency-name: tensorflow
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: keras
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: mediapipe
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # numpy is a range (<2.0), which the update types do not cover; MediaPipe
      # 0.10.21 needs 1.x.
      - dependency-name: numpy
        versions: [">=2.0"]
      - dependency-name: opencv-python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: opencv-contrib-python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: onnxruntime
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: onnxruntime-gpu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Only the optional ML grammar layer uses it, and CI cannot exercise that layer.
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
