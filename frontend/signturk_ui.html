<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGNTURK</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@1.21.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
  <style>
    :root{
      --bg:#f5f7fb;
      --surface:#ffffff;
      --surface-2:#f9fbff;
      --line:#dce3ee;
      --line-strong:#c7d2e1;
      --ink:#101828;
      --muted:#667085;
      --soft:#eef3f8;
      --brand:#0b4f6c;
      --brand-2:#127c89;
      --teal:#16a394;
      --green:#16a34a;
      --amber:#d97706;
      --red:#dc2626;
      --blue:#2563eb;
      --panel:#0b1220;
      --panel-2:#111827;
      --shadow:0 18px 45px rgba(15,23,42,.10);
      --radius:8px;
      --sidebar:276px;
    }
    *{box-sizing:border-box}
    html,body,#root{height:100%}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--ink);
      background:
        linear-gradient(180deg, rgba(11,79,108,.06), transparent 260px),
        var(--bg);
      letter-spacing:0;
    }
    button,input,select,textarea{font:inherit}
    button{border:0;cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.6}
    a{color:inherit;text-decoration:none}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .app{
      min-height:100%;
      display:grid;
      grid-template-columns:var(--sidebar) minmax(0,1fr);
    }
    .sidebar{
      min-height:100vh;
      background:#08111f;
      color:#d7e0ea;
      border-right:1px solid rgba(255,255,255,.08);
      display:flex;
      flex-direction:column;
      position:sticky;
      top:0;
      z-index:20;
    }
    .brand{
      height:84px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 22px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .brand-mark{
      width:42px;height:42px;
      border-radius:8px;
      display:grid;place-items:center;
      color:#fff;
      font-weight:900;
      background:linear-gradient(135deg,var(--brand),var(--teal));
      box-shadow:0 10px 24px rgba(22,163,148,.22);
    }
    .brand h1{margin:0;font-size:20px;letter-spacing:.06em}
    .brand p{margin:2px 0 0;color:#93a4b8;font-size:12px}
    .nav{
      padding:16px 12px;
      display:flex;
      flex-direction:column;
      gap:5px;
    }
    .nav-label{
      padding:15px 12px 7px;
      color:#8192a7;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .nav button{
      width:100%;
      min-height:42px;
      border-radius:8px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 12px;
      color:#c8d3df;
      background:transparent;
      text-align:left;
    }
    .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
    .nav button.active{
      background:rgba(22,163,148,.16);
      color:#fff;
      box-shadow:inset 3px 0 0 var(--teal);
    }
    .sidebar-footer{
      margin-top:auto;
      padding:14px 16px 18px;
      border-top:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .avatar{
      width:38px;height:38px;
      border-radius:8px;
      background:#13233a;
      color:#fff;
      display:grid;place-items:center;
      font-weight:800;
      flex:0 0 auto;
    }
    .user-meta{min-width:0;flex:1}
    .user-meta strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user-meta span{display:block;font-size:12px;color:#8da0b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .icon-btn{
      width:38px;height:38px;
      border-radius:8px;
      display:grid;place-items:center;
      background:var(--soft);
      color:var(--ink);
      border:1px solid var(--line);
    }
    .icon-btn:hover{border-color:var(--line-strong);background:#fff}
    .main{min-width:0;display:flex;flex-direction:column}
    .topbar{
      min-height:84px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:18px 28px;
      background:rgba(245,247,251,.82);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:15;
    }
    .mobile-menu{display:none}
    .page-title h2{margin:0;font-size:23px;line-height:1.15}
    .page-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .chip{
      min-height:32px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:0 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }
    .chip.ok{border-color:rgba(22,163,74,.22);color:#15803d;background:#eefdf4}
    .chip.warn{border-color:rgba(217,119,6,.25);color:#b45309;background:#fff8eb}
    .chip.bad{border-color:rgba(220,38,38,.22);color:#b91c1c;background:#fff1f2}
    .content{width:min(1480px,100%);margin:0 auto;padding:24px 28px 34px}
    .grid{display:grid;gap:16px}
    .grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .panel{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:8px;
      box-shadow:0 1px 2px rgba(16,24,40,.03);
    }
    .panel-head{
      min-height:58px;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .panel-head h3{margin:0;font-size:15px}
    .panel-head span{color:var(--muted);font-size:12px}
    .panel-body{padding:16px}
    .metric{
      padding:16px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      min-height:112px;
    }
    .metric .value{font-size:30px;font-weight:850;line-height:1;margin-top:10px}
    .metric .label{color:var(--muted);font-size:13px;font-weight:700}
    .metric .sub{color:var(--muted);font-size:12px;margin-top:8px}
    .metric-icon{
      width:42px;height:42px;border-radius:8px;
      display:grid;place-items:center;
      background:#e9f7f5;color:var(--brand-2);
      flex:0 0 auto;
    }
    .btn{
      min-height:40px;
      border-radius:8px;
      padding:0 14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-weight:800;
      color:var(--ink);
      background:#fff;
      border:1px solid var(--line);
      white-space:nowrap;
    }
    .btn:hover{border-color:var(--line-strong)}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn.primary:hover{background:#083f59}
    .btn.green{background:var(--green);border-color:var(--green);color:#fff}
    .btn.red{background:var(--red);border-color:var(--red);color:#fff}
    .btn.ghost{background:transparent}
    .btn.small{min-height:34px;padding:0 11px;font-size:12px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field label{font-size:12px;font-weight:800;color:#344054}
    .input,.select{
      width:100%;
      min-height:42px;
      border-radius:8px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      padding:0 12px;
      outline:none;
    }
    .input:focus,.select:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(18,124,137,.12)}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:620px}
    th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
    th{color:#475467;background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    td{color:#1f2937}
    tr:last-child td{border-bottom:0}
    .empty{
      padding:34px 18px;
      color:var(--muted);
      text-align:center;
      font-size:13px;
    }
    .auth-page{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px;
      background:
        linear-gradient(140deg, rgba(11,79,108,.15), transparent 42%),
        linear-gradient(320deg, rgba(22,163,148,.16), transparent 45%),
        var(--bg);
    }
    .auth-shell{
      width:min(1060px,100%);
      display:grid;
      grid-template-columns:1fr 410px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:8px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }
    .auth-brand{
      background:#08111f;
      color:#fff;
      padding:42px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      min-height:560px;
    }
    .auth-brand h1{margin:18px 0 8px;font-size:42px;letter-spacing:.06em}
    .auth-brand p{margin:0;color:#b7c5d8;max-width:460px;line-height:1.6}
    .auth-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px}
    .auth-stat{border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:14px;background:rgba(255,255,255,.04)}
    .auth-stat strong{display:block;font-size:24px}
    .auth-stat span{display:block;font-size:12px;color:#a9b9ce;margin-top:6px}
    .auth-form{padding:34px;display:flex;flex-direction:column;justify-content:center}
    .auth-form h2{margin:0 0 6px;font-size:25px}
    .auth-form p{margin:0 0 22px;color:var(--muted);font-size:13px}
    .auth-actions{display:flex;gap:8px;margin-top:16px}
    .alert{
      border-radius:8px;
      padding:11px 12px;
      font-size:13px;
      margin-bottom:14px;
      border:1px solid var(--line);
    }
    .alert.bad{background:#fff1f2;color:#b91c1c;border-color:#fecdd3}
    .alert.ok{background:#eefdf4;color:#15803d;border-color:#bbf7d0}
    .live-layout{
      display:grid;
      grid-template-columns:minmax(0,1.45fr) minmax(360px,.8fr);
      gap:16px;
      align-items:start;
    }
    .camera-panel{
      background:var(--panel);
      border:1px solid #182235;
      border-radius:8px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }
    .camera-top{
      min-height:54px;
      padding:10px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid rgba(255,255,255,.08);
      color:#e5edf6;
    }
    .camera-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .dark-chip{
      min-height:30px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:0 10px;
      border-radius:999px;
      background:#111b2c;
      border:1px solid #27344a;
      color:#c9d6e5;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .dark-chip.ok{color:#a7f3d0;border-color:#14532d;background:#0f2a24}
    .dark-chip.warn{color:#fde68a;border-color:#854d0e;background:#2c2211}
    .video-wrap{
      position:relative;
      aspect-ratio:16/10;
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        #070d18;
      background-size:34px 34px;
      overflow:hidden;
    }
    video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      background:#050914;
    }
    video.mirror{transform:scaleX(-1)}
    .camera-empty{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:#c2cfdd;
      text-align:center;
      padding:18px;
    }
    .camera-empty h3{margin:10px 0 3px;font-size:18px;color:#fff}
    .camera-empty p{margin:0;color:#8fa1b8;font-size:13px}
    .scan-line{
      position:absolute;
      left:0;right:0;
      height:2px;
      background:linear-gradient(90deg, transparent, var(--teal), transparent);
      opacity:.85;
      animation:scan 2.4s linear infinite;
      display:none;
    }
    .camera-panel.running .scan-line{display:block}
    @keyframes scan{0%{top:8%}100%{top:92%}}
    .camera-controls{
      min-height:66px;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-top:1px solid rgba(255,255,255,.08);
      flex-wrap:wrap;
    }
    .control-left,.control-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .result-panel .panel-body{display:flex;flex-direction:column;gap:14px}
    .prediction{
      min-height:168px;
      border-radius:8px;
      padding:18px;
      background:linear-gradient(135deg,#f8fbff,#eef9f7);
      border:1px solid var(--line);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .prediction-label{
      font-size:38px;
      line-height:1.05;
      font-weight:900;
      word-break:break-word;
    }
    .prediction-sub{color:var(--muted);font-size:13px;margin-top:8px}
    .confidence-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:16px;
    }
    .bar{
      height:10px;
      flex:1;
      background:#e8edf3;
      border-radius:999px;
      overflow:hidden;
    }
    .bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--teal));width:0}
    .top-list{display:flex;flex-direction:column;gap:8px}
    .top-row{
      display:grid;
      grid-template-columns:32px minmax(0,1fr) 54px;
      gap:9px;
      align-items:center;
      padding:10px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
    }
    .rank{
      width:28px;height:28px;border-radius:8px;
      display:grid;place-items:center;
      background:#edf8f7;
      color:var(--brand-2);
      font-weight:900;
      font-size:12px;
    }
    .top-row strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
    .top-row span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .transcript{
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height:230px;
      overflow:auto;
    }
    .transcript-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
    }
    .toggle{
      width:48px;height:28px;border-radius:999px;padding:3px;
      background:#d7dee8;
      display:flex;
      align-items:center;
      transition:.18s ease;
      border:1px solid transparent;
    }
    .toggle span{
      width:20px;height:20px;border-radius:50%;
      background:#fff;
      box-shadow:0 1px 4px rgba(0,0,0,.2);
      transform:translateX(0);
      transition:.18s ease;
    }
    .toggle.on{background:var(--brand-2)}
    .toggle.on span{transform:translateX(20px)}
    .settings-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:13px 0;
      border-bottom:1px solid var(--line);
    }
    .settings-row:last-child{border-bottom:0}
    .settings-row strong{display:block;font-size:13px}
    .settings-row span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
    .avatar-grid{
      display:grid;
      grid-template-columns:minmax(0,1fr) 340px;
      gap:16px;
      align-items:start;
    }
    .avatar-frame{
      width:100%;
      height:620px;
      border:0;
      display:block;
      background:#0b1220;
      border-radius:8px;
    }
    .word-list{display:flex;flex-direction:column;gap:7px;max-height:558px;overflow:auto}
    .word-btn{
      min-height:38px;
      border-radius:8px;
      border:1px solid var(--line);
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 10px;
      gap:8px;
      text-align:left;
    }
    .word-btn:hover{border-color:var(--brand-2)}
    .login-link{
      color:var(--brand-2);
      background:transparent;
      padding:0;
      font-weight:900;
    }
    @media (max-width:1200px){
      .grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .live-layout,.avatar-grid{grid-template-columns:1fr}
      .avatar-frame{height:520px}
    }
    @media (max-width:900px){
      .app{grid-template-columns:1fr}
      .sidebar{
        position:fixed;
        inset:0 auto 0 0;
        width:286px;
        transform:translateX(-102%);
        transition:.2s ease;
      }
      .sidebar.open{transform:translateX(0)}
      .mobile-menu{display:grid}
      .topbar{padding:14px 16px}
      .content{padding:16px}
      .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}
      .auth-shell{grid-template-columns:1fr}
      .auth-brand{min-height:auto;padding:28px}
      .auth-stats{grid-template-columns:1fr}
    }
    @media (max-width:560px){
      .page-title h2{font-size:19px}
      .top-actions{display:none}
      .camera-controls{align-items:stretch}
      .control-left,.control-right,.btn{width:100%}
      .btn{justify-content:center}
      .prediction-label{font-size:30px}
      .auth-form{padding:24px}
      .live-layout{grid-template-columns:minmax(0,1fr)}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useCallback, useEffect, useMemo, useRef, useState} = React;

const API = {
  baseUrl: window.location.origin || "http://127.0.0.1:8000",
  wsUrl: (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host,
  endpoints: {
    health: "/api/health",
    login: "/api/login",
    logout: "/api/logout",
    register: "/api/register",
    live: "/api/predict/live",
    history: "/api/history",
    summary: "/api/me/summary",
    modelStatus: "/api/model/status",
    dictionary: "/api/dictionary",
    settings: "/api/settings",
    adminOverview: "/api/admin/overview",
    adminUsers: "/api/admin/users",
    adminLogs: "/api/admin/logs",
    adminModel: "/api/admin/model",
    signs: "/signs",
    avatar3d: "/avatar3d"
  }
};
window.SIGNTURK_API = API;

const routes = [
  {id:"dashboard", label:"Panel", icon:"Home"},
  {id:"live", label:"Canlı Çeviri", icon:"Camera"},
  {id:"dictionary", label:"Sözlük", icon:"BookOpen"},
  {id:"avatar3d", label:"3D Animasyon", icon:"Box"},
  {id:"history", label:"Geçmiş", icon:"History"},
  {id:"settings", label:"Ayarlar", icon:"Settings"}
];
const adminRoutes = [
  {id:"admin/overview", label:"Admin Panel", icon:"Shield"},
  {id:"admin/users", label:"Kullanıcılar", icon:"Users"},
  {id:"admin/model", label:"Model Durumu", icon:"Cpu"},
  {id:"admin/logs", label:"Loglar", icon:"ListChecks"}
];

function Icon({name, size=18, strokeWidth=2}){
  const icon = window.lucide?.icons?.[name];
  const node = icon?.iconNode || icon;
  if (!Array.isArray(node)) return <span style={{width:size,height:size,display:"inline-block"}} />;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {node.map(([tag, attrs], i) => React.createElement(tag, {...attrs, key:i}))}
    </svg>
  );
}

function percent(value){
  const n = Number(value || 0);
  return `${Math.round(Math.max(0, Math.min(1, n)) * 100)}%`;
}

function initials(user){
  const source = user?.full_name || user?.name || user?.email || "ST";
  return source.split(/[\s@.]+/).filter(Boolean).slice(0,2).map(x => x[0]?.toUpperCase()).join("") || "ST";
}

const STORAGE_KEY = "signturk_user";

function storedToken(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null")?.access_token || ""; }
  catch{ return ""; }
}

function errorMessage(data){
  if (typeof data?.detail === "string") return data.detail;
  if (Array.isArray(data?.detail) && data.detail[0]?.msg) return data.detail[0].msg;
  return data?.error || "İstek başarısız";
}

async function apiFetch(path, options={}){
  const token = storedToken();
  const res = await fetch(API.baseUrl + path, {
    ...options,
    headers: {
      "Content-Type":"application/json",
      ...(token ? {Authorization:`Bearer ${token}`} : {}),
      ...(options.headers || {})
    }
  });
  if (res.status === 401 && token) window.dispatchEvent(new Event("signturk:logout"));
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(errorMessage(data));
  return data;
}

function useHealth(poll=true){
  const [health, setHealth] = useState(null);
  const load = useCallback(() => {
    fetch(API.baseUrl + API.endpoints.health).then(r => r.json()).then(setHealth).catch(() => setHealth(null));
  }, []);
  useEffect(() => {
    load();
    if (!poll) return;
    const id = setInterval(load, 8000);
    return () => clearInterval(id);
  }, [load, poll]);
  return [health, load];
}

function LivePage(){
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const wsRef = useRef(null);
  const streamRef = useRef(null);
  const timerRef = useRef(null);
  const inFlightRef = useRef(false);
  const predictionHoldUntilRef = useRef(0);
  const lastCommitRef = useRef({label:"", at:0});
  const [running, setRunning] = useState(false);
  const [starting, setStarting] = useState(false);
  const [status, setStatus] = useState("Hazır");
  const [prediction, setPrediction] = useState(null);
  const [streamMeta, setStreamMeta] = useState({buffer_length:0, hands_detected:0, label_tr:"Hazır", label_en:""});
  const [recent, setRecent] = useState([]);
  const [mirrorPreview, setMirrorPreview] = useState(true);
  const [speech, setSpeech] = useState(false);
  const [error, setError] = useState("");
  const [devices, setDevices] = useState([]);
  const [deviceId, setDeviceId] = useState("");
  const [pending, setPending] = useState(null);
  const [sentenceWords, setSentenceWords] = useState([]);
  const [sentence, setSentence] = useState("");
  const [health] = useHealth(false);
  const seqLen = health?.seq_len || 16;
  const speechRateRef = useRef(1);
  useEffect(() => {
    apiFetch(API.endpoints.settings).then(s => {
      setSpeech(!!s?.tts_enabled);
      speechRateRef.current = Number(s?.speech_rate) || 1;
    }).catch(() => {});
  }, []);

  const loadDevices = useCallback(async () => {
    try{
      const list = await navigator.mediaDevices.enumerateDevices();
      setDevices(list.filter(d => d.kind === "videoinput"));
    }catch{}
  }, []);

  useEffect(() => {
    loadDevices();
    return () => stopLive();
  }, []);

  const stopLive = useCallback(() => {
    if (timerRef.current){ clearTimeout(timerRef.current); timerRef.current = null; }
    inFlightRef.current = false;
    predictionHoldUntilRef.current = 0;
    if (wsRef.current){
      try{ wsRef.current.close(); }catch{}
      wsRef.current = null;
    }
    if (streamRef.current){
      streamRef.current.getTracks().forEach(t => t.stop());
      streamRef.current = null;
    }
    if (videoRef.current) videoRef.current.srcObject = null;
    setRunning(false);
    setStarting(false);
    setPending(null);
    setStreamMeta(prev => ({...prev, buffer_length:0, hands_detected:0, label_tr:"Durduruldu"}));
    setStatus("Durduruldu");
  }, []);

  const captureFrame = useCallback(() => {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas || !video.videoWidth || !video.videoHeight) return null;
    const targetW = 420;
    const targetH = Math.max(260, Math.round(targetW * video.videoHeight / video.videoWidth));
    canvas.width = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext("2d", {willReadFrequently:false});
    ctx.drawImage(video, 0, 0, targetW, targetH);
    return canvas.toDataURL("image/jpeg", 0.72);
  }, []);

  const scheduleSend = useCallback(() => {
    timerRef.current = setTimeout(() => {
      const ws = wsRef.current;
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (inFlightRef.current){ scheduleSend(); return; }
      const holdMs = predictionHoldUntilRef.current - Date.now();
      if (holdMs > 0){
        timerRef.current = setTimeout(scheduleSend, Math.min(holdMs, 1000));
        return;
      }
      const image = captureFrame();
      if (!image){ scheduleSend(); return; }
      inFlightRef.current = true;
      ws.send(JSON.stringify({image, mirror:false, ts:Date.now()}));
      scheduleSend();
    }, 70);
  }, [captureFrame]);

  const speak = useCallback((text) => {
    if (!speech || !text || !window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "tr-TR";
    utter.rate = speechRateRef.current;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }, [speech]);

  const sendAction = useCallback((obj) => {
    const ws = wsRef.current;
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }, []);

  const approveWord = useCallback(() => {
    if (pending) sendAction({action:"approve", word:pending.word});
  }, [pending, sendAction]);

  const rejectWord = useCallback(() => {
    setPending(null);
    sendAction({action:"reject"});
  }, [sendAction]);

  const undoWord = useCallback(() => sendAction({action:"undo"}), [sendAction]);
  const resetSentence = useCallback(() => sendAction({action:"reset_sentence"}), [sendAction]);

  const commitPrediction = useCallback((data) => {
    setStreamMeta(prev => ({
      buffer_length: data?.buffer_length ?? prev.buffer_length ?? 0,
      hands_detected: data?.hands_detected ?? prev.hands_detected ?? 0,
      label_tr: data?.label_tr || prev.label_tr || "",
      label_en: data?.label_en || prev.label_en || ""
    }));
    if (data?.class_id === -1) return;
    predictionHoldUntilRef.current = Date.now() + 1000;
    setPrediction(data);
    const label = data?.label_tr || "";
    const confident = data?.class_id !== -1 && data?.above_threshold !== false && Number(data?.confidence || 0) >= Number(data?.threshold || .4);
    if (!confident || !label) return;
    const clean = label.replace(/[()]/g,"").replace("?","").trim();
    if (data?.pending_word) setPending({word:data.pending_word, label_en:data.label_en || ""});
    const now = Date.now();
    if (lastCommitRef.current.label === clean && now - lastCommitRef.current.at < 1800) return;
    lastCommitRef.current = {label:clean, at:now};
    setRecent(prev => [{label:clean, conf:data.confidence, at:new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}, ...prev].slice(0,10));
  }, []);

  const startLive = useCallback(async () => {
    setStarting(true);
    setError("");
    setPrediction(null);
    setRecent([]);
    setStreamMeta({buffer_length:0, hands_detected:0, label_tr:"Başlatılıyor", label_en:""});
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          deviceId: deviceId ? {exact:deviceId} : undefined,
          width:{ideal:960},
          height:{ideal:600},
          frameRate:{ideal:15, max:15}
        },
        audio:false
      });
      streamRef.current = stream;
      if (videoRef.current){
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
      }
      await loadDevices();
      const ws = new WebSocket(`${API.wsUrl}${API.endpoints.live}?token=${encodeURIComponent(storedToken())}`);
      wsRef.current = ws;
      ws.onopen = () => {
        inFlightRef.current = false;
        predictionHoldUntilRef.current = 0;
        setRunning(true);
        setStarting(false);
        setStatus("Bağlandı");
        scheduleSend();
      };
      ws.onmessage = (event) => {
        inFlightRef.current = false;
        try{
          const data = JSON.parse(event.data);
          if (data.type === "sentence_update"){
            setSentenceWords(Array.isArray(data.words) ? data.words : []);
            setSentence(data.sentence || "");
            setPending(null);
            setStatus("Cümle güncellendi");
            // Only approved words are spoken: the sentence once it has two words, otherwise the word.
            if (data.added) speak(data.sentence || data.added);
            return;
          }
          if (data.type === "rejected"){
            setPending(null);
            setStatus("Tahmin reddedildi");
            return;
          }
          commitPrediction(data);
          if (data.class_id === -1) setStatus(data.label_tr || "Frame toplanıyor");
          else setStatus(data.above_threshold === false ? "Düşük güven · 1 sn bekleme" : "Tahmin hazır · 1 sn bekleme");
        }catch{
          setStatus("Yanıt okunamadı");
        }
      };
      ws.onerror = () => { inFlightRef.current = false; setError("WebSocket bağlantısı kurulamadı."); setStatus("Bağlantı hatası"); };
      ws.onclose = (event) => {
        inFlightRef.current = false;
        setRunning(false);
        if (event.code === 1008){ setError("Oturum süresi doldu, yeniden giriş yapın."); window.dispatchEvent(new Event("signturk:logout")); }
        else if (!starting) setStatus("Bağlantı kapandı");
      };
    }catch(err){
      setError(err.message || "Kamera açılamadı");
      stopLive();
    }finally{
      setStarting(false);
    }
  }, [deviceId, loadDevices, scheduleSend, commitPrediction, stopLive, starting, speak]);

  const bufferLen = streamMeta?.buffer_length || 0;
  const bufferPct = Math.max(0, Math.min(100, Math.round((bufferLen / seqLen) * 100)));
  const hasPrediction = prediction && prediction.class_id !== -1;
  const confPct = hasPrediction ? Math.round(Number(prediction?.confidence || 0) * 100) : 0;
  const displayLabel = hasPrediction ? prediction.label_tr : (running ? "Toplanıyor" : "Hazır");
  const displaySub = hasPrediction
    ? `${prediction?.label_en || "SIGNTURK"} · class ${prediction?.class_id ?? "-"}`
    : (streamMeta?.label_tr || status);
  const resultStatus = hasPrediction ? `Son tahmin ekranda · ${status}` : status;
  return (
    <div className="live-layout">
      <section className={`camera-panel ${running ? "running" : ""}`}>
        <div className="camera-top">
          <strong>SIGNTURK Kamera</strong>
          <div className="camera-meta">
            <span className={`dark-chip ${running ? "ok" : ""}`}><Icon name={running ? "Wifi" : "WifiOff"} size={14}/> {running ? "Açık" : "Kapalı"}</span>
            <span className="dark-chip"><Icon name="Layers" size={14}/> {bufferLen}/{seqLen}</span>
            <span className={`dark-chip ${(streamMeta?.hands_detected || 0) > 0 ? "ok" : "warn"}`}><Icon name="Hand" size={14}/> {streamMeta?.hands_detected ?? 0} el</span>
          </div>
        </div>
        <div className="video-wrap">
          <video ref={videoRef} className={mirrorPreview ? "mirror" : ""} playsInline muted />
          {!running && !starting && (
            <div className="camera-empty">
              <div>
                <Icon name="Camera" size={38}/>
                <h3>Kamera bekliyor</h3>
                <p>Başlat düğmesiyle canlı akış açılır.</p>
              </div>
            </div>
          )}
          <div className="scan-line" />
        </div>
        <div className="camera-controls">
          <div className="control-left">
            {!running ? (
              <button className="btn green" onClick={startLive} disabled={starting}><Icon name="Play"/> {starting ? "Açılıyor" : "Başlat"}</button>
            ) : (
              <button className="btn red" onClick={stopLive}><Icon name="Square"/> Durdur</button>
            )}
            <button className="btn" onClick={() => setMirrorPreview(v => !v)}><Icon name="RefreshCw"/> Önizleme</button>
          </div>
          <div className="control-right">
            <button className="btn" onClick={() => setSpeech(v => !v)}><Icon name={speech ? "Volume2" : "VolumeX"}/> Ses</button>
            <select className="select" style={{width:220}} value={deviceId} onChange={e => setDeviceId(e.target.value)} disabled={running}>
              <option value="">Varsayılan kamera</option>
              {devices.map(d => <option value={d.deviceId} key={d.deviceId}>{d.label || "Kamera"}</option>)}
            </select>
          </div>
        </div>
      </section>
      <aside className="grid result-panel" style={{gap:16}}>
        {error && <div className="alert bad">{error}</div>}
        <section className="panel">
          <div className="panel-head"><div><h3>Anlık Tahmin</h3><span>{resultStatus}</span></div><span className={`chip ${prediction?.above_threshold ? "ok" : "warn"}`}>{confPct}%</span></div>
          <div className="panel-body">
            <div className="prediction">
              <div>
                <div className="prediction-label">{displayLabel}</div>
                <div className="prediction-sub">{displaySub}</div>
              </div>
              <div>
                <div className="confidence-row"><span className="mono" style={{fontSize:12,width:38}}>{confPct}%</span><div className="bar"><span style={{width:`${confPct}%`}} /></div></div>
                <div className="confidence-row"><span className="mono" style={{fontSize:12,width:38}}>{bufferPct}%</span><div className="bar"><span style={{width:`${bufferPct}%`,background:"linear-gradient(90deg,#2563eb,#16a394)"}} /></div></div>
              </div>
            </div>
            {pending && running && (
              <div className="transcript-item" style={{marginTop:14,alignItems:"center"}}>
                <div><strong>{pending.word}</strong><span style={{display:"block",color:"var(--muted)",fontSize:12}}>Onay bekliyor</span></div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <button className="btn green" onClick={approveWord}><Icon name="Check"/> Doğru</button>
                  <button className="btn red" onClick={rejectWord}><Icon name="X"/> Yanlış</button>
                </div>
              </div>
            )}
          </div>
        </section>
        <section className="panel">
          <div className="panel-head"><div><h3>Cümle Şeridi</h3><span>{sentenceWords.length} onaylı kelime</span></div></div>
          <div className="panel-body">
            {sentenceWords.length ? (
              <>
                <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
                  {sentenceWords.map((w,i) => <span className="chip ok" key={`${w}-${i}`}>{w}</span>)}
                </div>
                <div className="prediction-label" style={{fontSize:20,lineHeight:1.35}}>{sentence || "-"}</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:14}}>
                  <button className="btn" onClick={undoWord}><Icon name="Undo2"/> Geri al</button>
                  <button className="btn" onClick={resetSentence}><Icon name="Trash2"/> Temizle</button>
                </div>
              </>
            ) : <div className="empty">Henüz onaylanan kelime yok.</div>}
          </div>
        </section>
        <section className="panel">
          <div className="panel-head"><div><h3>En İyi Tahminler</h3><span>Top-3 model çıktısı</span></div></div>
          <div className="panel-body">
            {prediction?.top_predictions?.length ? (
              <div className="top-list">
                {prediction.top_predictions.map((p,i) => (
                  <div className="top-row" key={i}>
                    <div className="rank">{i+1}</div>
                    <div><strong>{p.label_tr || p.TR || "-"}</strong><span>{p.label_en || p.EN || `class ${p.class_id}`}</span></div>
                    <strong>{percent(p.confidence)}</strong>
                  </div>
                ))}
              </div>
            ) : <div className="empty">16 frame tamamlanınca liste güncellenir.</div>}
          </div>
        </section>
        <section className="panel">
          <div className="panel-head"><div><h3>Oturum</h3><span>Güvenli sonuçlar</span></div></div>
          <div className="panel-body">
            {recent.length ? (
              <div className="transcript">{recent.map((r,i) => <div className="transcript-item" key={i}><div><strong>{r.label}</strong><span style={{display:"block",color:"var(--muted)",fontSize:12}}>{r.at}</span></div><span className="chip ok">{percent(r.conf)}</span></div>)}</div>
            ) : <div className="empty">Henüz güvenli tahmin yok.</div>}
          </div>
        </section>
      </aside>
      <canvas ref={canvasRef} style={{display:"none"}} />
    </div>
  );
}

function SettingsPage(){
  const [settings, setSettings] = useState({tts_enabled:false, speech_rate:1, avatar_speed:1});
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState("");
  useEffect(() => {
    apiFetch(API.endpoints.settings).then(d => setSettings(prev => ({...prev, ...d}))).catch(() => {});
  }, []);
  const save = async () => {
    setSaved(false); setError("");
    try{
      await apiFetch(API.endpoints.settings, {method:"POST", body:JSON.stringify(settings)});
      setSaved(true);
      setTimeout(() => setSaved(false), 1800);
    }catch(err){ setError(err.message || "Ayarlar kaydedilemedi"); }
  };
  const ToggleRow = ({k,title,sub}) => (
    <div className="settings-row">
      <div><strong>{title}</strong><span>{sub}</span></div>
      <button className={`toggle ${settings[k] ? "on" : ""}`} onClick={() => setSettings({...settings, [k]:!settings[k]})}><span /></button>
    </div>
  );
  return (
    <div className="grid cols-2">
      <section className="panel">
        <div className="panel-head"><div><h3>Tercihler</h3><span>SIGNTURK panel ayarları</span></div><button className="btn primary" onClick={save}><Icon name="Save"/> Kaydet</button></div>
        <div className="panel-body">
          {saved && <div className="alert ok">Ayarlar kaydedildi.</div>}
          {error && <div className="alert bad">{error}</div>}
          <ToggleRow k="tts_enabled" title="Sesli okuma" sub="Onaylanan kelimeleri ve cümleyi tarayıcının Türkçe sesiyle okur" />
        </div>
      </section>
      <section className="panel">
        <div className="panel-head"><div><h3>İnce Ayar</h3><span>Kullanıcı deneyimi</span></div></div>
        <div className="panel-body grid" style={{gap:14}}>
          <div className="field"><label>Konuşma hızı</label><input className="input" type="number" step="0.1" min="0.5" max="2" value={settings.speech_rate || 1} onChange={e => setSettings({...settings, speech_rate:Number(e.target.value)})} /></div>
          <div className="field"><label>Avatar hızı</label><input className="input" type="number" step="0.1" min="0.25" max="3" value={settings.avatar_speed || 1} onChange={e => setSettings({...settings, avatar_speed:Number(e.target.value)})} /></div>
        </div>
      </section>
    </div>
  );
}

// Avatar playback quality, reviewed sign by sign: good → fair → poor (slugs).
// Words missing from the list are appended alphabetically.
const SIGN_QUALITY_ORDER = [
  // ── good ──
  'acikmak','akraba','agabey','akilli','anahtar','ayna','ayni','bayram','bardak','bayrak',
  'bekar','cirkin','corba','dakika','devirmek','emek','et','fotograf','getirmek','gol',
  'gostermek','gulmek','hakli','hali','hayir','hep','hic','hoscakal','isik','itmek',
  'kapi','kaza','kemer','kim','koku','kolonya','makas','musluk','nerede','ocak',
  'onlar','orman','pantolon','pazartesi','piknik','saat','salca','semsiye','sevmek','siz',
  'terazi','terzi','var','yakin','yol','zaman',
  // ── fair ──
  'acele','agac','agir','akilsiz','alisveris','anne','arkadas','bakmak','bebek','bilgi_vermek',
  'carsamba','cocuk','cuma','devlet','dolu','dusman','ezberlemek','fil','gecmis','hafif',
  'hastane','hayirli_olsun','hayvan','hediye','helal','igne','kacmak','kalorifer','komur','leke',
  'maas','melek','mendil','merdiven','nasil','nine','ogretmen','olmaz','olur','oruc',
  'pastirma','patates','pencere','rica_etmek','savas','selam','sen','ses','seytan','sinir',
  'soz','tamam','tarak','tatil','telefon','tornavida','tuvalet','un','uzak','yalniz',
  'yapmak','yarabandi','yarin','yasak','yemek_pisirmek','yildiz','yorgun','yumurta',
  // ── poor ──
  'abla','afiyet_olsun','aglamak','aile','ataturk','ayakkabi','baba','bahce','bal','beklemek',
  'ben','benzin','beraber','biz','calismak','catal','caydanlik','cekic','cumartesi','cuzdan',
  'dede','degistirmek','doktor','dugun','dun','duvar','eczane','eldiven','emekli','erkek',
  'ev','evet','evli','futbol','gomlek','gormek','hasta','hata','havlu','icmek',
  'ilac','ilgilenmemek','kahvalti','kalem','kardes','kavsak','keske','kimlik','kira','kitap',
  'kiyma','kiz','kopek','kopru','kotu','kucak','masa','masallah','memnun_olmak','misafir',
  'mudur','neden','oda','odun','okul','olimpiyat','ozur_dilemek','pamuk','para','pazar',
  'persembe','polis','psikoloji','sabun','sali','sampiyon','sapka','seker','senet','serbest',
  'soylemek','sut','tarih','tatli','tavan','tehlike','tesekkur','turkiye','turuncu','vergi',
  'yanlis','yardim','yastik','yatak','yavas','yemek','yok','zor',
];
const SIGN_RANK = SIGN_QUALITY_ORDER.reduce((m,w,i) => { m[w]=i; return m; }, {});
function signRank(w){ const r = SIGN_RANK[String(w).toLowerCase()]; return r == null ? 100000 : r; }
// Quality tier by list position: good (0-55), fair (56-123), poor (124-221), other (unranked)
function signTier(w){ const r = signRank(w); return r < 56 ? 'iyi' : r < 124 ? 'orta' : r < 222 ? 'kotu' : 'diger'; }

function Avatar3DPage(){
  const [words, setWords] = useState([]);
  const [search, setSearch] = useState("");
  const [selected, setSelected] = useState("");
  const iframeRef = useRef(null);
  const avatarSpeedRef = useRef(1);
  useEffect(() => {
    apiFetch(API.endpoints.signs).then(d => setWords(d.words || [])).catch(() => setWords([]));
    apiFetch(API.endpoints.settings).then(s => {
      avatarSpeedRef.current = Number(s?.avatar_speed) || 1;
      sendSpeed();
    }).catch(() => {});
  }, []);
  const sendSpeed = () => {
    iframeRef.current?.contentWindow?.postMessage({type:"set_speed", value:avatarSpeedRef.current}, window.location.origin);
  };
  const play = (word) => {
    setSelected(word);
    // avatar3d.html only reacts to messages of type "play_sign"
    iframeRef.current?.contentWindow?.postMessage({type:"play_sign", word}, window.location.origin);
  };
  // Ordered by playback quality (good → fair → poor), not alphabetically
  const filtered = words
    .filter(w => w.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => signRank(a) - signRank(b) || a.localeCompare(b));
  return (
    <div className="avatar-grid">
      <iframe ref={iframeRef} className="avatar-frame" src={API.endpoints.avatar3d} title="SIGNTURK 3D Animasyon" onLoad={sendSpeed} />
      <section className="panel">
        <div className="panel-head"><div><h3>Animasyon Sözlüğü</h3><span>{filtered.length} kelime</span></div></div>
        <div className="panel-body">
          <div className="field" style={{marginBottom:12}}><input className="input" placeholder="Kelime ara" value={search} onChange={e => setSearch(e.target.value)} /></div>
          <div className="word-list">
            {filtered.map((w, i) => {
              // Divider between the "good" block and the rest
              const showDiv = i > 0 && signTier(filtered[i-1]) === 'iyi' && signTier(w) === 'orta';
              return (
                <React.Fragment key={w}>
                  {showDiv && <div style={{height:3,background:'#c9a96e',borderRadius:3,margin:'14px 2px',boxShadow:'0 0 8px rgba(201,169,110,.5)'}}/>}
                  <button className={"word-btn" + (selected===w ? " active" : "")} onClick={() => play(w)}><span>{w}</span><Icon name="Play" size={15}/></button>
                </React.Fragment>
              );
            })}
            {!filtered.length && <div className="empty">Animasyon kelimesi bulunamadı.</div>}
          </div>
        </div>
      </section>
    </div>
  );
}

function App(){
  const [userState, setUserState] = useState(() => {
    try{
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      return saved?.access_token ? saved : null;
    }catch{ return null; }
  });
  const setUser = useCallback((user) => {
    if (user) localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
    else{
      if (storedToken()) apiFetch(API.endpoints.logout, {method:"POST"}).catch(() => {});
      localStorage.removeItem(STORAGE_KEY);
    }
    setUserState(user);
  }, []);
  useEffect(() => {
    const onExpired = () => { localStorage.removeItem(STORAGE_KEY); setUserState(null); };
    window.addEventListener("signturk:logout", onExpired);
    return () => window.removeEventListener("signturk:logout", onExpired);
  }, []);
  if (!userState) return <AuthScreen onLogin={setUser}/>;
  return <Shell user={userState} setUser={setUser}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
