<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignTurk</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@1.21.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
  <style>
    :root{
      --bg:#f5f6f8;
      --surface:#ffffff;
      --surface-2:#f0f2f5;
      --line:#e2e6ec;
      --line-2:#cfd6df;
      --ink:#0f172a;
      --ink-2:#334155;
      --muted:#64748b;
      --brand:#0f766e;
      --brand-strong:#0b5e57;
      --brand-soft:#e3f3f1;
      --good:#15803d;
      --good-soft:#e7f6ec;
      --warn:#b45309;
      --warn-soft:#fdf2e1;
      --bad:#b91c1c;
      --bad-soft:#fdeaea;
      --stage:#0b1220;
      --radius-sm:8px;
      --radius:12px;
      --radius-lg:16px;
      --shadow-sm:0 1px 2px rgba(15,23,42,.06);
      --shadow:0 6px 24px rgba(15,23,42,.08);
      --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body,#root{min-height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit;color:inherit}
    button{cursor:pointer}
    a{color:var(--brand)}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.86em}
    .muted{color:var(--muted)}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

    /* ── Buttons ── */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s}
    .btn:hover{background:var(--surface-2)}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .btn:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.card-button:focus-visible{outline:3px solid rgba(15,118,110,.35);outline-offset:2px}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn.primary:hover{background:var(--brand-strong)}
    .btn.good{background:var(--good);border-color:var(--good);color:#fff}
    .btn.good:hover{filter:brightness(.95)}
    .btn.bad{background:var(--surface);border-color:#f0c9c9;color:var(--bad)}
    .btn.bad:hover{background:var(--bad-soft)}
    .btn.ghost{background:transparent;border-color:transparent}
    .btn.ghost:hover{background:var(--surface-2)}
    .btn.lg{min-height:48px;padding:0 22px;font-size:15px;border-radius:12px}
    .btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
    .btn.block{width:100%}
    .icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-2)}
    .icon-btn:hover{background:var(--surface-2)}
    .kbd{display:inline-block;min-width:20px;padding:1px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.4);font-size:11px;font-weight:700;opacity:.85}
    .btn:not(.primary):not(.good) .kbd{border-color:var(--line-2);color:var(--muted)}

    /* ── Pills, cards, fields ── */
    .pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
    .pill.good{background:var(--good-soft);color:var(--good)}
    .pill.warn{background:var(--warn-soft);color:var(--warn)}
    .pill.bad{background:var(--bad-soft);color:var(--bad)}
    .pill.brand{background:var(--brand-soft);color:var(--brand)}
    .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
    .dot.pulse{animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0}
    .card-head h2,.card-head h3{margin:0;font-size:16px;font-weight:700}
    .card-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
    .card-body{padding:16px 20px 20px}
    .field{display:grid;gap:6px}
    .field label{font-size:13px;font-weight:650;color:var(--ink-2)}
    .input,.select{width:100%;min-height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
    .input:focus,.select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
    .note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;background:var(--surface-2);color:var(--ink-2)}
    .note.warn{background:var(--warn-soft);color:#7c3d06}
    .note.bad{background:var(--bad-soft);color:#7f1d1d}
    .note.good{background:var(--good-soft);color:#14532d}
    .note svg{flex:none;margin-top:1px}
    .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
    .seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
    .seg button{min-height:32px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:650;font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
    .seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
    .seg button:disabled{opacity:.45;cursor:not-allowed}
    .toggle{position:relative;width:44px;height:26px;border-radius:999px;border:0;background:var(--line-2);transition:background .15s;flex:none}
    .toggle span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
    .toggle.on{background:var(--brand)}
    .toggle.on span{transform:translateX(18px)}
    input[type=range]{width:100%;accent-color:var(--brand)}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 20px;border-bottom:1px solid var(--line)}
    td{padding:12px 20px;border-bottom:1px solid var(--line)}
    tr:last-child td{border-bottom:0}
    .table-wrap{overflow-x:auto}
    .spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── App shell ── */
    .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;height:64px;padding:0 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--ink);text-decoration:none;background:none;border:0;padding:0}
    .brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:13px;font-weight:800;letter-spacing:.02em}
    .nav{display:flex;gap:4px;margin-left:8px}
    .nav button{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px}
    .nav button:hover{background:var(--surface-2)}
    .nav button.active{background:var(--brand-soft);color:var(--brand)}
    .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
    .user-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 6px;border-radius:12px;border:1px solid transparent;background:transparent}
    .user-btn:hover{background:var(--surface-2)}
    .avatar-circle{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:12px;font-weight:700}
    .menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:40}
    .menu-head{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
    .menu-head strong{display:block;font-size:14px}
    .menu-head span{font-size:12.5px;color:var(--muted)}
    .menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:550;text-align:left}
    .menu button:hover{background:var(--surface-2)}
    .page{max-width:1280px;margin:0 auto;padding:28px 24px 48px}
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
    .page-head h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
    .page-head p{margin:4px 0 0;color:var(--muted)}
    .grid{display:grid;gap:16px}
    .cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .mobile-only{display:none}

    /* ── Live page ── */
    .live{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
    .live-main{display:grid;gap:14px;min-width:0}
    .stage-card{padding:14px}
    .stage-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .stage{position:relative;width:100%;aspect-ratio:16/10;background:var(--stage);border-radius:12px;overflow:hidden}
    .stage.off{min-height:320px}
    .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
    .stage video.mirror{transform:scaleX(-1)}
    .stage .guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .stage-status{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:3}
    .stage-status .pill{background:rgba(11,18,32,.72);color:#fff;backdrop-filter:blur(8px)}
    .stage-status .pill.good{background:rgba(21,128,61,.85);color:#fff}
    .stage-status .pill.warn{background:rgba(180,83,9,.88);color:#fff}
    .stage-off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#cbd5e1;padding:24px;z-index:2}
    .stage-off h3{margin:12px 0 6px;color:#fff;font-size:20px}
    .stage-off p{margin:0 auto 18px;max-width:420px;font-size:14px;color:#94a3b8}
    .countdown{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:800;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.5);z-index:4;pointer-events:none}
    .rec-bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.15);z-index:3}
    .rec-bar span{display:block;height:100%;background:#ef4444;transition:width .08s linear}
    .rec-dot{position:absolute;right:14px;top:14px;display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;background:rgba(239,68,68,.92);color:#fff;font-size:13px;font-weight:700;z-index:3}
    .stage-controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
    .stage-controls .spacer{flex:1}
    .result-card{position:sticky;top:84px}
    .result{padding:22px 20px;display:grid;gap:16px}
    .result-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .result-word{font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.02em;word-break:break-word}
    .result-word.unsure{color:var(--ink-2)}
    .result-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .choices{display:grid;gap:8px}
    .choice{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
    .choice:hover{border-color:var(--brand);background:var(--brand-soft)}
    .choice strong{flex:1;font-size:15px}
    .choice .muted{font-size:13px}
    .alt-row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
    .link-btn{border:0;background:none;padding:0;color:var(--brand);font-weight:650;font-size:13.5px;display:inline-flex;align-items:center;gap:5px}
    .link-btn:hover{text-decoration:underline}
    .placeholder{display:grid;gap:12px;color:var(--muted);font-size:14px}
    .placeholder ol{margin:0;padding-left:18px;display:grid;gap:6px}
    .recent{border-top:1px solid var(--line);padding:14px 20px 18px}
    .recent-list{display:grid;gap:6px;margin-top:8px}
    .recent-item{display:flex;justify-content:space-between;align-items:center;font-size:14px}
    .sentence-card{display:flex;align-items:center;gap:16px;padding:16px 20px;flex-wrap:wrap}
    .sentence-words{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .sentence-text{flex:1;min-width:200px;font-size:20px;font-weight:700}
    .sentence-text.empty-text{font-size:15px;font-weight:500;color:var(--muted)}
    .word-chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:650;font-size:13.5px}

    /* ── Modal ── */
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:60;padding:20px}
    .modal{width:min(720px,100%);background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line)}
    .modal-head h3{margin:0;font-size:17px}
    .avatar-frame{display:block;width:100%;aspect-ratio:4/3;border:0;background:#3a4250}

    /* ── Dictionary ── */
    .dict{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
    .dict-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
    .card-button{display:grid;gap:2px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .15s,box-shadow .15s}
    .card-button:hover{border-color:var(--brand);box-shadow:var(--shadow-sm)}
    .card-button.active{border-color:var(--brand);background:var(--brand-soft)}
    .card-button strong{font-size:15.5px}
    .card-button span{font-size:13px;color:var(--muted)}
    .dict-side{position:sticky;top:84px}
    .search{position:relative}
    .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
    .search .input{padding-left:38px}

    /* ── Home, auth ── */
    .hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
    .hero-main{padding:28px}
    .hero-main h1{margin:0 0 8px;font-size:30px;line-height:1.15;letter-spacing:-.02em}
    .hero-main p{margin:0 0 22px;color:var(--ink-2);font-size:16px;max-width:560px}
    .steps{display:grid;gap:14px}
    .step{display:flex;gap:14px;align-items:flex-start}
    .step-num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:14px}
    .step strong{display:block;font-size:15px}
    .step span{color:var(--muted);font-size:14px}
    .stat{padding:18px 20px}
    .stat .label{font-size:13px;color:var(--muted);font-weight:600}
    .stat .value{font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
    .stat .sub{font-size:13px;color:var(--muted)}
    .auth{min-height:100vh;display:grid;place-items:center;padding:24px}
    .auth-card{width:min(420px,100%);padding:30px}
    .auth-card .brand{margin-bottom:22px}
    .auth-card h1{margin:0 0 6px;font-size:22px}
    .auth-card > p{margin:0 0 20px;color:var(--muted)}
    .auth-foot{margin-top:18px;text-align:center;font-size:12.5px;color:var(--muted)}
    .settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
    .settings-row:last-child{border-bottom:0}
    .settings-row strong{display:block;font-size:15px}
    .settings-row span{font-size:13.5px;color:var(--muted)}
    .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .kv-item{padding:14px 16px;border:1px solid var(--line);border-radius:12px}
    .kv-item .k{font-size:12.5px;color:var(--muted);font-weight:650}
    .kv-item .v{font-size:18px;font-weight:750;margin-top:2px}
    .kv-item .s{font-size:12.5px;color:var(--muted);margin-top:2px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:70}

    @media (max-width:1080px){
      .live,.dict,.hero{grid-template-columns:minmax(0,1fr)}
      .result-card,.dict-side{position:static}
      .cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width:760px){
      .topbar{padding:0 14px;gap:10px}
      .nav{display:none}
      .mobile-only{display:inline-grid}
      .nav.open{display:flex;flex-direction:column;position:absolute;top:64px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);padding:8px;margin:0}
      .top-right .pill{display:none}
      .page{padding:20px 16px 40px}
      .cols-2,.cols-3,.cols-4{grid-template-columns:minmax(0,1fr)}
      .result-word{font-size:36px}
      .countdown{font-size:84px}
      .stage-controls .btn{flex:1}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useCallback, useEffect, useRef, useState} = React;

const API = {
  baseUrl: window.location.origin || "http://127.0.0.1:8000",
  wsUrl: (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host,
  endpoints: {
    health: "/api/health",
    login: "/api/login",
    logout: "/api/logout",
    register: "/api/register",
    live: "/api/predict/live226",
    history: "/api/history",
    summary: "/api/me/summary",
    dictionary: "/api/dictionary",
    settings: "/api/settings",
    adminOverview: "/api/admin/overview",
    adminUsers: "/api/admin/users",
    adminLogs: "/api/admin/logs",
    adminModel: "/api/admin/model",
    avatar3d: "/avatar3d"
  }
};
window.SIGNTURK_API = API;

// A recording is 4 seconds at about 12 fps; the server cuts the sign out of it.
const CLIP_FRAMES = 48;
const CLIP_INTERVAL_MS = 83;
const MODEL_STATES = {ready:"Hazır", loading:"Yükleniyor", idle:"Bekliyor", missing:"Dosyalar eksik", error:"Hata", disabled:"Kapalı"};
const DEVICE_NAMES = {cuda:"GPU", cpu:"CPU"};
const STORAGE_KEY = "signturk_user";

function recordFrames(model){ return model?.record_frames || CLIP_FRAMES; }

const ROUTES = [
  {id:"home", label:"Ana sayfa", icon:"House"},
  {id:"live", label:"Çeviri", icon:"Camera"},
  {id:"dictionary", label:"Sözlük", icon:"BookOpen"},
  {id:"history", label:"Geçmiş", icon:"History"}
];
const ADMIN_TABS = [
  {id:"admin/overview", label:"Genel bakış"},
  {id:"admin/users", label:"Kullanıcılar"},
  {id:"admin/model", label:"Model"},
  {id:"admin/logs", label:"Kayıtlar"}
];
const LEGACY_ROUTES = {dashboard:"home", avatar3d:"dictionary"};

function Icon({name, size=18, strokeWidth=2}){
  const icon = window.lucide?.icons?.[name];
  const node = icon?.iconNode || icon;
  if (!Array.isArray(node)) return <span style={{width:size,height:size,display:"inline-block"}} />;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {node.map(([tag, attrs], i) => React.createElement(tag, {...attrs, key:i}))}
    </svg>
  );
}

function percent(value){
  return `%${Math.round(Math.max(0, Math.min(1, Number(value || 0))) * 100)}`;
}

// "59.8" or "59.8%" from the server, written the Turkish way: %59,8
function trPercent(value){
  const number = Number(String(value ?? "").replace("%", ""));
  if (value == null || value === "-" || value === "" || Number.isNaN(number)) return "-";
  return `%${number.toLocaleString("tr-TR", {maximumFractionDigits:1})}`;
}

function initials(user){
  const source = user?.full_name || user?.email || "ST";
  return source.split(/[\s@.]+/).filter(Boolean).slice(0,2).map(x => x[0]?.toLocaleUpperCase("tr-TR")).join("") || "ST";
}

function storedToken(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null")?.access_token || ""; }
  catch{ return ""; }
}

function errorMessage(data){
  if (typeof data?.detail === "string") return data.detail;
  if (Array.isArray(data?.detail) && data.detail[0]?.msg) return data.detail[0].msg;
  return data?.error || "İstek başarısız";
}

async function apiFetch(path, options={}){
  const token = storedToken();
  const res = await fetch(API.baseUrl + path, {
    ...options,
    headers: {
      "Content-Type":"application/json",
      ...(token ? {Authorization:`Bearer ${token}`} : {}),
      ...(options.headers || {})
    }
  });
  if (res.status === 401 && token) window.dispatchEvent(new Event("signturk:logout"));
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(errorMessage(data));
  return data;
}

function useHealth(poll=true){
  const [health, setHealth] = useState(null);
  const load = useCallback(() => {
    fetch(API.baseUrl + API.endpoints.health).then(r => r.json()).then(setHealth).catch(() => setHealth(null));
  }, []);
  useEffect(() => {
    load();
    if (!poll) return;
    const id = setInterval(load, 8000);
    return () => clearInterval(id);
  }, [load, poll]);
  return health;
}

function formatTime(iso, withDate=false){
  if (!iso) return "-";
  const date = new Date(iso);
  return withDate
    ? date.toLocaleString("tr-TR", {day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"})
    : date.toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"});
}

function dayLabel(iso){
  const date = new Date(iso);
  const today = new Date();
  const yesterday = new Date(Date.now() - 86400000);
  if (date.toDateString() === today.toDateString()) return "Bugün";
  if (date.toDateString() === yesterday.toDateString()) return "Dün";
  return date.toLocaleDateString("tr-TR", {day:"numeric", month:"long", year:"numeric"});
}

function ModelPill({model}){
  if (!model) return <span className="pill"><span className="dot"/> Sunucu yok</span>;
  if (model.ready) return <span className="pill good"><span className="dot"/> Model hazır · {DEVICE_NAMES[model.device] || "-"}</span>;
  if (model.state === "loading" || model.state === "idle") return <span className="pill warn"><span className="dot pulse"/> Model yükleniyor</span>;
  return <span className="pill bad"><span className="dot"/> {MODEL_STATES[model.state] || "Model hazır değil"}</span>;
}

function Modal({title, onClose, children}){
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" role="dialog" aria-modal="true" aria-label={title} onClick={e => e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="icon-btn" onClick={onClose} aria-label="Kapat"><Icon name="X"/></button></div>
        {children}
      </div>
    </div>
  );
}

// The 3D avatar page, playing one sign; avatar3d.html listens for "play_sign".
function AvatarPlayer({word, label}){
  const frameRef = useRef(null);
  const speedRef = useRef(1);
  const send = useCallback(() => {
    const target = frameRef.current?.contentWindow;
    if (!target) return;
    target.postMessage({type:"set_speed", value:speedRef.current}, window.location.origin);
    if (word) target.postMessage({type:"play_sign", word, label:label || word}, window.location.origin);
  }, [word, label]);
  useEffect(() => {
    apiFetch(API.endpoints.settings).then(s => { speedRef.current = Number(s?.avatar_speed) || 1; }).catch(() => {});
  }, []);
  useEffect(() => { send(); }, [send]);
  return <iframe ref={frameRef} className="avatar-frame" src={API.endpoints.avatar3d} title="İşaretin 3D animasyonu" onLoad={send} />;
}

function LivePage({model}){
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const wsRef = useRef(null);
  const streamRef = useRef(null);
  const clipTimerRef = useRef(null);
  const streamTimerRef = useRef(null);
  const previewTimerRef = useRef(null);
  const previewBusyRef = useRef(false);
  const inFlightRef = useRef(0);
  const modeRef = useRef("record");
  const autoApproveRef = useRef(false);
  const speechRef = useRef(false);
  const speechRateRef = useRef(1);
  const keyRef = useRef({});
  const [running, setRunning] = useState(false);
  const [starting, setStarting] = useState(false);
  const [error, setError] = useState("");
  const [devices, setDevices] = useState([]);
  const [deviceId, setDeviceId] = useState("");
  const [mirror, setMirror] = useState(true);
  const [speech, setSpeech] = useState(false);
  const [mode, setMode] = useState("record");      // record, continuous (hands-free)
  const [watch, setWatch] = useState("off");       // off, waiting, signing, reading
  const [autoApprove, setAutoApprove] = useState(false);
  const [clipState, setClipState] = useState("idle");   // idle, countdown, recording, processing
  const [countdown, setCountdown] = useState(0);
  const [sent, setSent] = useState(0);
  const [result, setResult] = useState(null);
  const [pending, setPending] = useState(null);
  const [approved, setApproved] = useState(null);
  const [words, setWords] = useState([]);
  const [sentence, setSentence] = useState("");
  const [framing, setFraming] = useState(null);
  const [recent, setRecent] = useState([]);
  const [howTo, setHowTo] = useState(null);
  const [aspect, setAspect] = useState(16 / 10);
  const clipFrames = recordFrames(model);
  const ready = !!model?.ready;
  const canContinuous = !!model?.continuous;
  const previewEvery = model?.device === "cuda" ? 250 : 1000;

  useEffect(() => { speechRef.current = speech; }, [speech]);
  useEffect(() => {
    apiFetch(API.endpoints.settings).then(s => {
      setSpeech(!!s?.tts_enabled);
      speechRateRef.current = Number(s?.speech_rate) || 1;
    }).catch(() => {});
  }, []);

  const loadDevices = useCallback(async () => {
    try{ setDevices((await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput")); }catch{}
  }, []);

  const clearTimers = useCallback(() => {
    for (const ref of [clipTimerRef, streamTimerRef, previewTimerRef]){
      if (ref.current){ clearTimeout(ref.current); clearInterval(ref.current); ref.current = null; }
    }
    inFlightRef.current = 0;
    previewBusyRef.current = false;
  }, []);

  const stopLive = useCallback(() => {
    clearTimers();
    if (wsRef.current){ try{ wsRef.current.close(); }catch{} wsRef.current = null; }
    if (streamRef.current){ streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    if (videoRef.current) videoRef.current.srcObject = null;
    setRunning(false); setStarting(false); setClipState("idle"); setCountdown(0); setWatch("off"); setFraming(null); setPending(null);
  }, [clearTimers]);

  useEffect(() => { loadDevices(); return () => stopLive(); }, []);

  // Frames are sent unmirrored at 640 px wide; only the preview is mirrored.
  const captureFrame = useCallback(() => {
    const video = videoRef.current, canvas = canvasRef.current;
    if (!video || !canvas || !video.videoWidth || !video.videoHeight) return null;
    canvas.width = 640;
    canvas.height = Math.round(640 * video.videoHeight / video.videoWidth);
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.8);
  }, []);

  const send = useCallback((obj) => {
    const ws = wsRef.current;
    if (ws && ws.readyState === WebSocket.OPEN){ ws.send(JSON.stringify(obj)); return true; }
    return false;
  }, []);

  const speak = useCallback((text, always=false) => {
    if ((!speechRef.current && !always) || !text || !window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "tr-TR";
    utter.rate = speechRateRef.current;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }, []);

  // Between recordings a few frames a second only check the framing.
  const startPreview = useCallback(() => {
    if (previewTimerRef.current) clearInterval(previewTimerRef.current);
    previewBusyRef.current = false;
    previewTimerRef.current = setInterval(() => {
      if (previewBusyRef.current) return;
      const image = captureFrame();
      if (image && send({image, preview:true})) previewBusyRef.current = true;
    }, previewEvery);
  }, [captureFrame, send, previewEvery]);

  const stopPreview = useCallback(() => {
    if (previewTimerRef.current){ clearInterval(previewTimerRef.current); previewTimerRef.current = null; }
    previewBusyRef.current = false;
  }, []);

  // Hands-free: frames go out without a button, at most two awaiting an answer.
  const startStream = useCallback(() => {
    stopPreview();
    if (streamTimerRef.current) clearInterval(streamTimerRef.current);
    inFlightRef.current = 0;
    send({action:"continuous", auto_approve:autoApproveRef.current});
    setWatch("waiting");
    streamTimerRef.current = setInterval(() => {
      if (inFlightRef.current >= 2) return;
      const image = captureFrame();
      if (image && send({image})) inFlightRef.current += 1;
    }, CLIP_INTERVAL_MS);
  }, [captureFrame, send, stopPreview]);

  const stopStream = useCallback(() => {
    if (streamTimerRef.current){ clearInterval(streamTimerRef.current); streamTimerRef.current = null; }
    inFlightRef.current = 0;
    setWatch("off");
  }, []);

  const recordSign = useCallback(() => {
    if (clipState !== "idle" || !running || modeRef.current !== "record") return;
    stopPreview();
    setResult(null); setPending(null); setApproved(null);
    setClipState("countdown");
    let remaining = 3;
    setCountdown(remaining);
    const tick = () => {
      remaining -= 1;
      if (remaining > 0){ setCountdown(remaining); clipTimerRef.current = setTimeout(tick, 1000); return; }
      setCountdown(0);
      setClipState("recording");
      setSent(0);
      send({action:"start"});
      let count = 0;
      clipTimerRef.current = setInterval(() => {
        const image = captureFrame();
        if (image && send({image})){ count += 1; setSent(count); }
        if (count >= clipFrames){
          clearInterval(clipTimerRef.current); clipTimerRef.current = null;
          send({action:"end"});
          setClipState("processing");
        }
      }, CLIP_INTERVAL_MS);
    };
    clipTimerRef.current = setTimeout(tick, 1000);
  }, [clipState, running, clipFrames, captureFrame, send, stopPreview]);

  const chooseMode = useCallback((next) => {
    if (next === modeRef.current || clipState !== "idle") return;
    modeRef.current = next;
    setMode(next);
    setResult(null); setPending(null); setApproved(null);
    if (!running) return;
    if (next === "continuous") startStream();
    else{ stopStream(); send({action:"continuous", on:false}); startPreview(); }
  }, [clipState, running, startStream, stopStream, startPreview, send]);

  const toggleAutoApprove = useCallback(() => {
    const next = !autoApproveRef.current;
    autoApproveRef.current = next;
    setAutoApprove(next);
    if (streamTimerRef.current) send({action:"continuous", auto_approve:next});
  }, [send]);

  const approve = useCallback((gloss) => {
    if (!send(gloss ? {action:"approve", word:gloss} : {action:"approve"})) return;
    setPending(null);
  }, [send]);
  const reject = useCallback(() => { send({action:"reject"}); setPending(null); setResult(null); }, [send]);
  const undo = useCallback(() => send({action:"undo"}), [send]);
  const clearSentence = useCallback(() => send({action:"reset_sentence"}), [send]);

  const onMessage = useCallback((event) => {
    let data;
    try{ data = JSON.parse(event.data); }catch{ return; }
    if (data.type === "unavailable"){ setError(data.message || "Model hazır değil."); return; }
    if (data.type === "framing"){ previewBusyRef.current = false; setFraming(data); return; }
    if (data.type === "watching"){
      inFlightRef.current = Math.max(0, inFlightRef.current - 1);
      if (modeRef.current === "continuous"){ setWatch(data.state); if (data.framing) setFraming(data.framing); }
      return;
    }
    if (data.type === "continuous"){
      if (!data.on && modeRef.current === "continuous"){
        stopStream(); modeRef.current = "record"; setMode("record"); startPreview();
        if (data.error) setError(data.error);
      }
      return;
    }
    if (data.type === "result"){
      setClipState("idle");
      if (modeRef.current === "record") startPreview();
      if (data.error){ setResult({error:data.error}); return; }
      setResult(data);
      setApproved(null);
      if (data.framing) setFraming(data.framing);
      setPending(data.pending_word ? {word:data.pending_word, text:data.pending_text || data.pending_word} : null);
      const top = data.top?.[0];
      if (top) setRecent(prev => [{text:top.text_tr, conf:top.confidence, sure:data.confident}, ...prev].slice(0, 5));
      return;
    }
    if (data.type === "sentence_update"){
      setWords(Array.isArray(data.display_words) ? data.display_words : (data.words || []));
      setSentence(data.sentence || "");
      setPending(null);
      if (data.added){ setApproved(data.added); speak(data.sentence || (data.display_words || []).slice(-1)[0] || data.added); }
      return;
    }
    if (data.type === "rejected") setPending(null);
  }, [speak, startPreview, stopStream]);

  const startLive = useCallback(async () => {
    setStarting(true); setError("");
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{deviceId: deviceId ? {exact:deviceId} : undefined, width:{ideal:960}, height:{ideal:600}, frameRate:{ideal:15, max:15}},
        audio:false
      });
      streamRef.current = stream;
      const video = videoRef.current;
      video.srcObject = stream;
      await video.play();
      if (video.videoWidth && video.videoHeight) setAspect(video.videoWidth / video.videoHeight);
      await loadDevices();
      const ws = new WebSocket(`${API.wsUrl}${API.endpoints.live}`);
      wsRef.current = ws;
      ws.onopen = () => {
        // The token goes in the first message, not in the URL, so it stays out of server logs.
        ws.send(JSON.stringify({action:"auth", token:storedToken()}));
        setRunning(true); setStarting(false);
        if (modeRef.current === "continuous") startStream(); else startPreview();
      };
      ws.onmessage = onMessage;
      ws.onerror = () => setError("Sunucuyla bağlantı kurulamadı.");
      ws.onclose = (event) => {
        clearTimers();
        setRunning(false); setClipState("idle"); setWatch("off");
        if (event.code === 1008){ setError("Oturumunuzun süresi doldu; yeniden giriş yapın."); window.dispatchEvent(new Event("signturk:logout")); }
      };
    }catch(err){
      setError(err?.name === "NotAllowedError" ? "Kamera izni verilmedi. Tarayıcının adres çubuğundan izin verin." : (err.message || "Kamera açılamadı"));
      stopLive();
    }finally{ setStarting(false); }
  }, [deviceId, loadDevices, onMessage, startPreview, startStream, stopLive, clearTimers]);

  // Space records, Enter approves, Esc rejects (not while typing in a field)
  keyRef.current = {recordSign, approve, reject, pending, running, mode};
  useEffect(() => {
    const onKey = (e) => {
      if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName) && e.key !== "Escape") return;
      const k = keyRef.current;
      if (e.code === "Space" && k.running && k.mode === "record"){ e.preventDefault(); k.recordSign(); }
      else if (e.key === "Enter" && k.pending){ e.preventDefault(); k.approve(); }
      else if (e.key === "Escape" && k.pending){ k.reject(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const top = result?.top || [];
  const best = top[0];
  const confident = !!result?.confident;
  const framingBad = framing && framing.ok === false;
  const busy = clipState === "processing" || watch === "reading";
  const watchPill = {
    waiting: <span className="pill"><span className="dot"/> İşaret bekleniyor</span>,
    signing: <span className="pill good"><span className="dot pulse"/> İşaret algılandı</span>,
    reading: <span className="pill"><span className="spinner" style={{width:12,height:12,borderWidth:2}}/> Okunuyor</span>
  }[watch];
  const unavailable = !model ? "Sunucuya ulaşılamıyor." : !ready ? (model.state === "loading" || model.state === "idle" ? "Model yükleniyor, birazdan hazır olur." : (model.message || "Model hazır değil.")) : "";

  return (
    <div className="live">
      <div className="live-main">
        <section className="card stage-card">
          <div className="stage-bar">
            <div className="seg" role="tablist" aria-label="Çeviri modu">
              <button className={mode === "record" ? "active" : ""} onClick={() => chooseMode("record")} disabled={clipState !== "idle"}><Icon name="Video" size={16}/> Kayıt</button>
              <button className={mode === "continuous" ? "active" : ""} onClick={() => chooseMode("continuous")} disabled={!canContinuous || clipState !== "idle"}
                title={canContinuous ? "Düğmesiz: her işaret kendiliğinden okunur" : "Düğmesiz mod GPU ister"}><Icon name="Hand" size={16}/> Sürekli</button>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <button className="icon-btn" onClick={() => setMirror(v => !v)} title="Önizlemeyi aynala" aria-label="Önizlemeyi aynala"><Icon name="FlipHorizontal2"/></button>
              <button className="icon-btn" onClick={() => setSpeech(v => !v)} title={speech ? "Sesli okumayı kapat" : "Sesli okumayı aç"} aria-label="Sesli okuma"><Icon name={speech ? "Volume2" : "VolumeX"}/></button>
              <select className="select" style={{width:190,minHeight:38}} value={deviceId} onChange={e => setDeviceId(e.target.value)} disabled={running} aria-label="Kamera">
                <option value="">Varsayılan kamera</option>
                {devices.map(d => <option value={d.deviceId} key={d.deviceId}>{d.label || "Kamera"}</option>)}
              </select>
            </div>
          </div>
          <div className={`stage ${running ? "" : "off"}`} style={{aspectRatio:aspect}}>
            <video ref={videoRef} className={mirror ? "mirror" : ""} playsInline muted/>
            {running && <FramingGuide ok={framing ? framing.ok : null}/>}
            {running && (
              <div className="stage-status">
                {framing && (framing.ok
                  ? <span className="pill good"><Icon name="Check" size={14}/> Kadraj uygun</span>
                  : <span className="pill warn"><Icon name="TriangleAlert" size={14}/> {framing.hint}</span>)}
                {mode === "continuous" && watchPill}
                {mode === "continuous" && autoApprove && <span className="pill"><Icon name="CheckCheck" size={14}/> Otomatik onay</span>}
              </div>
            )}
            {clipState === "recording" && <div className="rec-dot"><span className="dot pulse"/> Kayıt</div>}
            {clipState === "recording" && <div className="rec-bar"><span style={{width:`${Math.min(100, sent / clipFrames * 100)}%`}}/></div>}
            {clipState === "countdown" && <div className="countdown">{countdown}</div>}
            {!running && (
              <div className="stage-off">
                <div>
                  <Icon name="Camera" size={40}/>
                  <h3>Kamera kapalı</h3>
                  <p>{mode === "continuous"
                    ? "Başlatınca işaret yapın ve her işaretten sonra ellerinizi indirin; işaretler kendiliğinden okunur."
                    : "Başlatınca \"İşareti kaydet\"e basın; 3-2-1'den sonra dört saniye içinde işareti yapın."}</p>
                  <button className="btn primary lg" onClick={startLive} disabled={starting || !ready}>
                    {starting ? <span className="spinner"/> : <Icon name="Play"/>} {starting ? "Açılıyor" : "Kamerayı başlat"}</button>
                </div>
              </div>
            )}
          </div>
          {running && (
            <div className="stage-controls">
              {mode === "record" ? (
                <button className="btn primary lg" onClick={recordSign} disabled={clipState !== "idle"}>
                  {clipState === "processing" ? <span className="spinner"/> : <Icon name="Circle"/>}
                  {clipState === "idle" ? "İşareti kaydet" : clipState === "processing" ? "Okunuyor" : "Kaydediliyor"}
                  {clipState === "idle" && <span className="kbd">Boşluk</span>}
                </button>
              ) : (
                <button className={`btn lg ${autoApprove ? "primary" : ""}`} onClick={toggleAutoApprove}
                  title="Açıkken emin olunan sonuç onay beklemeden cümleye girer; Geri al ile silinir">
                  <Icon name="CheckCheck"/> Otomatik onay {autoApprove ? "açık" : "kapalı"}
                </button>
              )}
              <span className="spacer"/>
              <button className="btn lg" onClick={stopLive}><Icon name="Square"/> Durdur</button>
            </div>
          )}
          {(error || unavailable) && <div className="note bad" style={{marginTop:12}}><Icon name="CircleAlert" size={18}/>{error || unavailable}</div>}
          {running && framingBad && (
            <div className="note warn" style={{marginTop:12}}><Icon name="Lightbulb" size={18}/>
              <div>Model, belden yukarısı ve elleri görünen kayıtlarla eğitildi. Kameradan biraz uzaklaşın ya da kamerayı aşağı eğin; çerçeve yeşile dönünce doğruluk en yüksektir.</div></div>
          )}
        </section>
        <section className="card sentence-card">
          <div className="result-label" style={{minWidth:60}}>Cümle</div>
          {words.length ? <div className="sentence-words">{words.map((w, i) => <span className="word-chip" key={`${w}-${i}`}>{w}</span>)}</div> : null}
          <div className={`sentence-text ${sentence ? "" : "empty-text"}`}>{sentence || (words.length ? "Cümle için bir kelime daha onaylayın." : "Onayladığınız kelimeler burada cümleye dönüşür.")}</div>
          <div style={{display:"flex",gap:6}}>
            <button className="icon-btn" onClick={() => speak(sentence || words.join(" "), true)} disabled={!words.length} title="Seslendir" aria-label="Seslendir"><Icon name="Volume2"/></button>
            <button className="icon-btn" onClick={undo} disabled={!words.length || !running} title="Son kelimeyi geri al" aria-label="Geri al"><Icon name="Undo2"/></button>
            <button className="icon-btn" onClick={clearSentence} disabled={!words.length || !running} title="Cümleyi temizle" aria-label="Temizle"><Icon name="Trash2"/></button>
          </div>
        </section>
      </div>

      <aside className="card result-card" aria-live="polite">
        <div className="result">
          {busy ? (
            <div className="placeholder" style={{placeItems:"center",padding:"30px 0"}}><span className="spinner" style={{width:28,height:28,color:"var(--brand)"}}/>İşaret okunuyor</div>
          ) : result?.error ? (
            <div className="note warn"><Icon name="TriangleAlert" size={18}/>{result.error}</div>
          ) : best ? (
            <>
              <div>
                <div className="result-label">{approved ? "Cümleye eklendi" : confident ? "Tanınan işaret" : "Emin değilim"}</div>
                <div className={`result-word ${confident ? "" : "unsure"}`}>{approved ? (words[words.length - 1] || best.text_tr) : best.text_tr}</div>
                <div className="result-meta" style={{marginTop:8}}>
                  <span className={`pill ${confident ? "good" : "warn"}`}>{percent(best.confidence)} güven</span>
                  <button className="link-btn" onClick={() => setHowTo({gloss:best.gloss, text:best.text_tr})}><Icon name="CirclePlay" size={16}/> Nasıl yapılır?</button>
                </div>
              </div>
              {result.feedback && <div className="note warn"><Icon name="Lightbulb" size={18}/>{result.feedback}</div>}
              {pending && confident && !approved && (
                <div className="result-actions">
                  <button className="btn good lg" onClick={() => approve()}><Icon name="Check"/> Doğru</button>
                  <button className="btn bad lg" onClick={reject}><Icon name="X"/> Yanlış</button>
                </div>
              )}
              {!confident && !approved && (
                <div className="choices">
                  <div className="muted" style={{fontSize:13.5}}>Hangisini yaptınız?</div>
                  {top.map(p => (
                    <button className="choice" key={p.gloss} onClick={() => approve(p.gloss)} disabled={!running}>
                      <strong>{p.text_tr}</strong><span className="muted">{percent(p.confidence)}</span><Icon name="Plus" size={16}/>
                    </button>
                  ))}
                  <button className="btn ghost sm" onClick={reject} disabled={!running}>Hiçbiri</button>
                </div>
              )}
              {confident && !approved && top.length > 1 && (
                <div className="alt-row">Ya da: {top.slice(1).map(p => <button key={p.gloss} className="link-btn" onClick={() => approve(p.gloss)} disabled={!running}>{p.text_tr}</button>)}</div>
              )}
            </>
          ) : (
            <div className="placeholder">
              <div className="result-label">Sonuç</div>
              {mode === "continuous" ? (
                <ol><li>Kameranın önünde bir işaret yapın.</li><li>Ellerinizi indirip bir an bekleyin.</li><li>Tanınan işaret burada görünür.</li></ol>
              ) : (
                <ol><li>"İşareti kaydet"e basın ya da Boşluk'a dokunun.</li><li>3-2-1'den sonra işareti yapın ve ellerinizi indirin.</li><li>Sonucu Doğru ya da Yanlış ile onaylayın.</li></ol>
              )}
              <div className="muted" style={{fontSize:13}}>Kısayollar: Enter doğru, Esc yanlış.</div>
            </div>
          )}
        </div>
        {recent.length > 0 && (
          <div className="recent">
            <div className="result-label">Son tahminler</div>
            <div className="recent-list">
              {recent.map((r, i) => <div className="recent-item" key={i}><span>{r.text}</span><span className={`pill ${r.sure ? "good" : ""}`}>{percent(r.conf)}</span></div>)}
            </div>
          </div>
        )}
      </aside>
      <canvas ref={canvasRef} style={{display:"none"}}/>
      {howTo && <HowToModal sign={howTo} onClose={() => setHowTo(null)}/>}
    </div>
  );
}

function DictionaryPage(){
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [selected, setSelected] = useState(null);
  const [narrow, setNarrow] = useState(() => window.matchMedia("(max-width:1080px)").matches);
  useEffect(() => {
    apiFetch(API.endpoints.dictionary).then(d => setRows(Array.isArray(d) ? d : [])).catch(() => setRows([])).finally(() => setLoading(false));
    const query = window.matchMedia("(max-width:1080px)");
    const onChange = () => setNarrow(query.matches);
    query.addEventListener("change", onChange);
    return () => query.removeEventListener("change", onChange);
  }, []);
  const needle = search.trim().toLocaleLowerCase("tr-TR");
  const filtered = rows
    .filter(r => !needle || `${r.text} ${r.tr} ${r.en || ""} ${r.class_id}`.toLocaleLowerCase("tr-TR").includes(needle))
    .sort((a, b) => a.text.localeCompare(b.text, "tr"));
  const pick = (r) => setSelected({gloss:r.animation_key || r.tr, text:r.text, en:r.en, id:r.class_id, avatar:!!r.animation_key});
  return (
    <>
      <div className="page-head">
        <div><h1>Sözlük</h1><p>SignTurk'ün tanıdığı {rows.length || 226} işaret. Bir işarete dokunun, avatar nasıl yapıldığını göstersin.</p></div>
        <div className="search" style={{width:"min(340px,100%)"}}><Icon name="Search" size={17}/>
          <input className="input" placeholder="Türkçe ya da İngilizce ara" value={search} onChange={e => setSearch(e.target.value)} aria-label="İşaret ara"/></div>
      </div>
      <div className="dict">
        <div>
          {loading ? <div className="empty"><span className="spinner"/></div> : filtered.length ? (
            <div className="dict-grid">
              {filtered.map(r => (
                <button key={r.class_id} className={`card-button ${selected?.id === r.class_id ? "active" : ""}`} onClick={() => pick(r)}>
                  <strong>{r.text}</strong><span>{r.en || "-"}</span>
                </button>
              ))}
            </div>
          ) : <div className="card empty">"{search}" için işaret bulunamadı.</div>}
        </div>
        {!narrow && (
          <aside className="card dict-side">
            {selected ? (
              <>
                <AvatarPlayer word={selected.avatar ? selected.gloss : ""} label={selected.text}/>
                <div className="card-body">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:10}}>
                    <h2 style={{margin:0,fontSize:24}}>{selected.text}</h2><span className="pill">AUTSL {selected.id}</span>
                  </div>
                  <div className="muted" style={{marginTop:4}}>{selected.en || "-"}</div>
                  {!selected.avatar && <div className="note warn" style={{marginTop:12}}>Bu işaretin animasyonu yok.</div>}
                </div>
              </>
            ) : <div className="empty" style={{padding:"60px 20px"}}><Icon name="Hand" size={32}/><div style={{marginTop:10}}>Animasyonunu görmek için bir işaret seçin.</div></div>}
          </aside>
        )}
      </div>
      {narrow && selected && <HowToModal sign={selected} onClose={() => setSelected(null)}/>}
    </>
  );
}

function HistoryPage(){

    apiFetch(API.endpoints.history).then(d => setRows(Array.isArray(d) ? d : [])).catch(() => setRows([])).finally(() => setLoading(false));
  }, []);
  const groups = [];
  for (const row of rows){
    const label = row.created_at ? dayLabel(row.created_at) : "Tarihsiz";

    groups[groups.length - 1].rows.push(row);

  return (
    <>
      <div className="page-head"><div><h1>Geçmiş</h1><p>Onayladığınız son {rows.length} kelime.</p></div></div>

        <div className="grid" style={{gap:16}}>
          {groups.map(g => (
            <section className="card" key={g.label}>
              <div className="card-head"><h3>{g.label}</h3><span className="muted" style={{fontSize:13}}>{g.rows.length} kelime</span></div>
              <div className="table-wrap" style={{marginTop:8}}>
                <table><tbody>{g.rows.map((r, i) => (
                  <tr key={r.id ?? i}><td style={{width:90}} className="muted">{formatTime(r.created_at)}</td><td><strong>{r.text || r.result}</strong></td>
                    <td style={{textAlign:"right"}}>{trPercent(r.confidence) !== "-" ? <span className="pill">{trPercent(r.confidence)}</span> : <span className="muted">-</span>}</td></tr>
                ))}</tbody></table>
              </div>
            </section>
          ))}
        </div>
      )}
    </>
  );
}

            </div>

  return (
    <section className="card"><div className="table-wrap">
      <table><thead><tr><th>Ad</th><th>E-posta</th><th>Rol</th><th>Durum</th><th>Oturum</th></tr></thead>
        <tbody>{rows.map((u, i) => <tr key={u.id || i}><td><strong>{u.name || u.full_name || "-"}</strong></td><td>{u.email}</td>
          <td><span className={`pill ${u.role === "Admin" ? "brand" : ""}`}>{u.role === "Admin" ? "Yönetici" : "Kullanıcı"}</span></td>
          <td>{u.status === "Active" ? "Etkin" : (u.status || "-")}</td><td>{u.sessions ?? "-"}</td></tr>)}</tbody></table>
    </div></section>
  );
}

function AdminModel(){
  const [m, setM] = useState(null);
  useEffect(() => { apiFetch(API.endpoints.adminModel).then(setM).catch(() => {}); }, []);
  if (!m) return <div className="card empty"><span className="spinner"/></div>;
  const model = m.model_226 || {};
  const ms = value => value != null ? `${value} ms` : "Henüz yok";
  const items = [
    ["Durum", MODEL_STATES[model.state] || "-", model.message || `${model.num_classes ?? 226} işaret`],
    ["Cihaz", DEVICE_NAMES[model.device] || "-", "RTMW ve YOLOX"],
    ["Düğmesiz mod", model.continuous ? "Açık" : "Kapalı", "kare başına en çok 60 ms"],
    ["Kayıt", `${Math.round(recordFrames(model) / (model.camera_fps || 12))} sn`, `${recordFrames(model)} kare; kesilen işaretten ${model.frame_count ?? 32} kare`],
    ["Kare süresi", ms(model.avg_frame_ms), "kişi tespiti ve poz"],
    ["Kişi tespiti", ms(model.avg_detect_ms), `${model.detect_every ?? 1} karede bir`],
    ["Poz", ms(model.avg_pose_ms), "kare başına RTMW"],
    ["Onay eşiği", percent(m.thresholds?.top1 ?? .7), `ikinciden en az ${percent(m.thresholds?.margin ?? .12)} önde`],
    ["Akışlar", Object.keys(m.streams || {}).length || "-", Object.entries(m.streams || {}).map(([name, weight]) => `${name} ${weight}`).join(" · ")],
    ["Avatar", m.landmark_words ?? "-", "animasyonu olan işaret"]
  ];
  return <section className="card"><div className="card-body"><div className="kv">{items.map(([k, v, s]) => <div className="kv-item" key={k}><div className="k">{k}</div><div className="v">{String(v)}</div><div className="s">{s}</div></div>)}</div></div></section>;
}

function AdminLogs(){
  const [rows, setRows] = useState([]);
  useEffect(() => { apiFetch(API.endpoints.adminLogs).then(d => setRows(Array.isArray(d) ? d : [])).catch(() => {}); }, []);
  const tone = {Success:"good", Warning:"warn", Error:"bad"};
  return (
    <section className="card"><div className="table-wrap">
      <table><thead><tr><th>Zaman</th><th>Seviye</th><th>Kayıt</th><th>Kullanıcı</th></tr></thead>
        <tbody>{rows.map((l, i) => <tr key={l.id || i}><td className="muted" style={{whiteSpace:"nowrap"}}>{formatTime(l.timestamp, true)}</td>
          <td><span className={`pill ${tone[l.level] || ""}`}>{l.level}</span></td><td>{l.message}</td><td className="muted">{l.user || "-"}</td></tr>)}</tbody></table>
    </div></section>
  );
}

function App(){
  const [user, setUserState] = useState(() => {
    try{ const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); return saved?.access_token ? saved : null; }
    catch{ return null; }
  });
  const setUser = useCallback((next) => {
    if (next) localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    else{
      if (storedToken()) apiFetch(API.endpoints.logout, {method:"POST"}).catch(() => {});
      localStorage.removeItem(STORAGE_KEY);
    }
    setUserState(next);
  }, []);
  useEffect(() => {
    const onExpired = () => { localStorage.removeItem(STORAGE_KEY); setUserState(null); };
    window.addEventListener("signturk:logout", onExpired);
    return () => window.removeEventListener("signturk:logout", onExpired);
  }, []);
  if (!user) return <AuthScreen onLogin={setUser}/>;
  return <Shell user={user} setUser={setUser}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
